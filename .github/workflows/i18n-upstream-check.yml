name: i18n-upstream-check

on:
  workflow_dispatch:
  schedule:
    # Run weekly on Monday at 06:00 UTC
    - cron: "0 6 * * 1"

jobs:
  check-upstream:
    name: Check upstream i18n status
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.14

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Add upstream remote
        run: |
          git remote remove upstream || true
          git remote add upstream https://github.com/can1357/oh-my-pi.git
          git fetch --no-tags upstream refs/tags/*:refs/tags/*

      - name: Run i18n status check
        id: status
        run: |
          bun run i18n:status -- --remote --json > i18n-status.json
          echo "json<<EOF" >> "$GITHUB_OUTPUT"
          cat i18n-status.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Generate human summary
        run: |
          bun run i18n:status -- --remote > i18n-status.txt
          {
            echo "# i18n Upstream Status"
            echo ""
            echo "Generated: $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo ""
            echo '```'
            cat i18n-status.txt
            echo '```'
            echo ""
            echo "## Machine-readable JSON"
            echo ""
            echo '```json'
            cat i18n-status.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload status artifact
        uses: actions/upload-artifact@v4
        with:
          name: i18n-status-${{ github.run_number }}
          path: |
            i18n-status.json
            i18n-status.txt
          retention-days: 30
          compression-level: 1
